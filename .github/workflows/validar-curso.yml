name: Validar documentação do curso

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-documentacao:
    name: verificar-documentacao
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v5
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Validar Markdown e ligações locais
        run: python scripts/validar_curso.py
